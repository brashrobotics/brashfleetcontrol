openapi: 3.1.0
info:
  title: BRASH Fleet Core API
  version: 0.12.0
  description: Authenticated, role-authorized vendor-independent missions, workflows, infrastructure, traffic, alarms, and append-only audit API.
servers:
  - url: http://127.0.0.1:4273
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Fleet Core health summary
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, robots, missions]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  robots: { type: integer, minimum: 0 }
                  missions: { type: integer, minimum: 0 }
  /api/v1/fleet/snapshot:
    get:
      operationId: getFleetSnapshot
      responses:
        "200":
          description: Canonical Fleet snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetSnapshot"
  /api/v1/identity/me:
    get:
      operationId: getCurrentIdentity
      responses:
        "200":
          description: Authenticated Fleet API identity and effective permissions
          content:
            application/json:
              schema:
                type: object
                required: [identity]
                properties:
                  identity: { $ref: "#/components/schemas/Identity" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Append-only security and operator audit history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/analytics/operations:
    get:
      operationId: getOperationalAnalytics
      responses:
        "200":
          description: Point-in-time operational fleet aggregates
          content:
            application/json:
              schema:
                type: object
                required: [analytics]
                properties:
                  analytics: { $ref: "#/components/schemas/OperationalAnalytics" }
  /api/v1/metrics:
    get:
      operationId: getPrometheusMetrics
      responses:
        "200":
          description: Low-cardinality Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/dispatch/queue:
    get:
      operationId: getDispatchQueue
      responses:
        "200":
          description: Priority-aged missions awaiting automatic dispatch
          content:
            application/json:
              schema:
                type: object
                required: [queue]
                properties:
                  queue: { $ref: "#/components/schemas/DispatchQueue" }
  /api/v1/alarms:
    get:
      operationId: getAlarms
      responses:
        "200":
          description: Active operational alarms and severity summary
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary: { $ref: "#/components/schemas/AlarmSummary" }
  /api/v1/alarms/{alarmId}/acknowledge:
    parameters:
      - name: alarmId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: acknowledgeAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Alarm acknowledged by an operator
          content:
            application/json:
              schema:
                type: object
                required: [alarm]
                properties:
                  alarm: { $ref: "#/components/schemas/Alarm" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/maps:
    get:
      operationId: listMapTopologies
      responses:
        "200":
          description: Published map topologies known to Fleet Core
          content:
            application/json:
              schema:
                type: object
                required: [maps]
                properties:
                  maps:
                    type: array
                    items: { $ref: "#/components/schemas/MapTopology" }
  /api/v1/maps/{mapId}/topology:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      operationId: getMapTopology
      responses:
        "200":
          description: Versioned traffic graph for one factory map
          content:
            application/json:
              schema:
                type: object
                required: [topology]
                properties:
                  topology: { $ref: "#/components/schemas/MapTopology" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/map-versions:
    get:
      operationId: listMapVersions
      parameters:
        - name: familyId
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Immutable map revision catalog
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/MapVersion" }
    post:
      operationId: createMapVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMapVersionRequest" }
      responses:
        "201":
          description: Draft map revision created
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { $ref: "#/components/schemas/MapVersion" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/map-versions/{mapId}/publish:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      operationId: publishMapVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Draft map made available to missions and robots
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { $ref: "#/components/schemas/MapVersion" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/map-versions/{mapId}/retire:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      operationId: retireMapVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Unused map revision retired
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { $ref: "#/components/schemas/MapVersion" }
        "409":
          description: Map is still in use or is the last published revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/infrastructure/resources:
    get:
      operationId: listInfrastructureResources
      parameters:
        - name: mapId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Factory infrastructure catalog for a map revision
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items: { $ref: "#/components/schemas/InfrastructureResource" }
    post:
      operationId: createInfrastructureResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInfrastructureResourceRequest" }
      responses:
        "201":
          description: Infrastructure resource created and topology-bound
          content:
            application/json:
              schema:
                type: object
                required: [resource]
                properties:
                  resource: { $ref: "#/components/schemas/InfrastructureResource" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/infrastructure/resources/{resourceId}/status:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: updateInfrastructureResourceStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInfrastructureResourceStatusRequest" }
      responses:
        "200":
          description: Resource availability updated
          content:
            application/json:
              schema:
                type: object
                required: [resource]
                properties:
                  resource: { $ref: "#/components/schemas/InfrastructureResource" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/traffic/schedule:
    get:
      operationId: getTrafficSchedule
      parameters:
        - name: mapId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Route plans and time-window reservations for a map
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule: { $ref: "#/components/schemas/TrafficSchedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/traffic/restrictions:
    get:
      operationId: listTrafficRestrictions
      parameters:
        - name: mapId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Active edge and node closures for a map
          content:
            application/json:
              schema:
                type: object
                required: [restrictions]
                properties:
                  restrictions:
                    type: array
                    items: { $ref: "#/components/schemas/TrafficRestriction" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createTrafficRestriction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTrafficRestrictionRequest" }
      responses:
        "201":
          description: Resource closed for future route planning
          content:
            application/json:
              schema:
                type: object
                required: [restriction]
                properties:
                  restriction: { $ref: "#/components/schemas/TrafficRestriction" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/traffic/restrictions/{restrictionId}/clear:
    parameters:
      - name: restrictionId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: clearTrafficRestriction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmActionRequest" }
      responses:
        "200":
          description: Resource reopened for route planning
          content:
            application/json:
              schema:
                type: object
                required: [restriction]
                properties:
                  restriction: { $ref: "#/components/schemas/TrafficRestriction" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/recovery/status:
    get:
      operationId: getFleetRecoveryStatus
      responses:
        "200":
          description: Fleet heartbeat, recovery, and traffic lease summary
          content:
            application/json:
              schema:
                type: object
                required: [recovery]
                properties:
                  recovery: { $ref: "#/components/schemas/FleetRecoveryStatus" }
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      responses:
        "200":
          description: Durable workflows ordered by creation time
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
    post:
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkflowRequest" }
      responses:
        "201":
          description: Validated DAG workflow persisted for asynchronous execution
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getWorkflow
      responses:
        "200":
          description: Workflow aggregate with step execution state
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workflows/{workflowId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    post:
      operationId: cancelWorkflow
      responses:
        "200":
          description: Workflow cancellation requested or completed
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions:
    post:
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionRequest"
      responses:
        "201":
          description: Mission created and, unless disabled, dispatched
          content:
            application/json:
              schema:
                type: object
                required: [mission]
                properties:
                  mission: { $ref: "#/components/schemas/Mission" }
                  dispatch: { $ref: "#/components/schemas/DispatchResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/missions/{missionId}:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    get:
      operationId: getMission
      responses:
        "200":
          description: Mission details
          content:
            application/json:
              schema:
                type: object
                required: [mission]
                properties:
                  mission: { $ref: "#/components/schemas/Mission" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{missionId}/dispatch:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    post:
      operationId: dispatchMission
      responses:
        "200":
          description: Dispatch decision and command receipt
          content:
            application/json:
              schema:
                type: object
                required: [dispatch]
                properties:
                  dispatch: { $ref: "#/components/schemas/DispatchResult" }
  /api/v1/missions/{missionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    post:
      operationId: cancelMission
      responses:
        "200":
          description: Mission cancellation completed or was already completed
          content:
            application/json:
              schema:
                type: object
                required: [cancellation]
                properties:
                  cancellation: { $ref: "#/components/schemas/MissionCancellationResult" }
        "202":
          description: Cancellation delivery was attempted and awaits robot confirmation
          content:
            application/json:
              schema:
                type: object
                required: [cancellation]
                properties:
                  cancellation: { $ref: "#/components/schemas/MissionCancellationResult" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{missionId}/events:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    get:
      operationId: getMissionEvents
      responses:
        "200":
          description: Ordered durable mission audit trail
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MissionEvent" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/missions/{missionId}/route:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    get:
      operationId: getMissionRoute
      responses:
        "200":
          description: Traffic plan assigned to a mission, if one exists
          content:
            application/json:
              schema:
                type: object
                required: [route]
                properties:
                  route:
                    oneOf:
                      - { $ref: "#/components/schemas/TrafficPlan" }
                      - { type: "null" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Fleet API token
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MapId:
      name: mapId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated identity lacks the required permission or site scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Identity:
      type: object
      required: [subjectId, displayName, subjectType, role, permissions, siteIds]
      properties:
        subjectId: { type: string }
        displayName: { type: string }
        subjectType: { type: string, enum: [USER, SERVICE] }
        role: { type: string, enum: [VIEWER, OPERATOR, DISPATCHER, FLEET_ADMIN, INTEGRATION] }
        permissions:
          type: array
          items: { type: string, enum: [fleet:read, mission:create, mission:dispatch, mission:cancel, workflow:create, workflow:cancel, alarm:acknowledge, traffic:manage, map:manage, resource:manage, observability:read, audit:read] }
        siteIds:
          type: array
          items: { type: string }
    AuditEvent:
      type: object
      required: [auditEventId, occurredAt, actorId, actorDisplayName, actorRole, action, targetType, targetId, outcome, correlationId, requestMethod, requestPath, siteId, metadata]
      properties:
        auditEventId: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string }
        actorDisplayName: { type: string }
        actorRole: { type: [string, "null"], enum: [VIEWER, OPERATOR, DISPATCHER, FLEET_ADMIN, INTEGRATION, null] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        outcome: { type: string, enum: [ATTEMPTED, SUCCEEDED, DENIED, FAILED] }
        correlationId: { type: string }
        requestMethod: { type: string }
        requestPath: { type: string }
        siteId: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
    OperationalAnalytics:
      type: object
      required: [generatedAt, robots, missions, workflows, traffic, alarms]
      properties:
        generatedAt: { type: string, format: date-time }
        robots:
          type: object
          required: [total, online, degraded, offline, available, utilized, utilizationPercent]
          properties:
            total: { type: integer }
            online: { type: integer }
            degraded: { type: integer }
            offline: { type: integer }
            available: { type: integer }
            utilized: { type: integer }
            utilizationPercent: { type: number, minimum: 0, maximum: 100 }
        missions:
          type: object
          required: [total, active, queued, completed, failed, cancelled, completionRatePercent]
          properties:
            total: { type: integer }
            active: { type: integer }
            queued: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
            completionRatePercent: { type: number, minimum: 0, maximum: 100 }
        workflows:
          type: object
          required: [total, active, succeeded, failed, retryCount]
          properties:
            total: { type: integer }
            active: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            retryCount: { type: integer }
        traffic:
          type: object
          required: [activeRoutes, activeReservations, delayedRoutes, scheduledWaitSeconds]
          properties:
            activeRoutes: { type: integer }
            activeReservations: { type: integer }
            delayedRoutes: { type: integer }
            scheduledWaitSeconds: { type: number }
        alarms:
          type: object
          required: [open, acknowledged, critical, warning]
          properties:
            open: { type: integer }
            acknowledged: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
    Location:
      type: object
      additionalProperties: false
      required: [stationId, mapId, x, y]
      properties:
        stationId: { type: string, minLength: 1 }
        mapId: { type: string, minLength: 1 }
        x: { type: number }
        y: { type: number }
        zoneId: { type: string, minLength: 1 }
    CreateMissionRequest:
      type: object
      additionalProperties: false
      required: [type, priority, requiredCapabilities, payloadKg, pickup, dropoff]
      properties:
        type: { const: TRANSPORT }
        externalReference: { type: string, minLength: 1 }
        priority: { type: number, minimum: 0, maximum: 100 }
        requiredCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        payloadKg: { type: number, minimum: 0 }
        pickup: { $ref: "#/components/schemas/Location" }
        dropoff: { $ref: "#/components/schemas/Location" }
        autoDispatch: { type: boolean, default: true }
    WorkflowStepDefinition:
      type: object
      additionalProperties: false
      required: [stepId, name, type, dependsOn, timeoutSeconds, maxAttempts, retryDelaySeconds]
      properties:
        stepId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [TRANSPORT, WAIT, CHARGE, INSPECT, DOCK] }
        dependsOn:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        timeoutSeconds: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1, maximum: 20 }
        retryDelaySeconds: { type: integer, minimum: 0 }
        mission: { $ref: "#/components/schemas/CreateMissionRequest" }
        resourceId: { type: string, minLength: 1 }
        durationSeconds: { type: integer, minimum: 0 }
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1 }
        externalReference: { type: string, minLength: 1 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/WorkflowStepDefinition" }
    WorkflowStep:
      allOf:
        - $ref: "#/components/schemas/WorkflowStepDefinition"
        - type: object
          required: [status, attemptCount, missionId, startedAt, completedAt, nextAttemptAt, timeoutAt, waitUntil, lastError]
          properties:
            status: { type: string, enum: [PENDING, WAITING_RETRY, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
            attemptCount: { type: integer, minimum: 0 }
            missionId: { type: [string, "null"] }
            startedAt: { type: [string, "null"], format: date-time }
            completedAt: { type: [string, "null"], format: date-time }
            nextAttemptAt: { type: string, format: date-time }
            timeoutAt: { type: [string, "null"], format: date-time }
            waitUntil: { type: [string, "null"], format: date-time }
            lastError: { type: [string, "null"] }
    Workflow:
      type: object
      required: [workflowId, name, externalReference, status, createdAt, updatedAt, completedAt, failureReason, steps]
      properties:
        workflowId: { type: string }
        name: { type: string }
        externalReference: { type: [string, "null"] }
        status: { type: string, enum: [PENDING, RUNNING, CANCELLING, SUCCEEDED, FAILED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        failureReason: { type: [string, "null"] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
    Mission:
      type: object
      required:
        - missionId
        - type
        - priority
        - requiredCapabilities
        - payloadKg
        - pickup
        - dropoff
        - state
        - assignedRobotId
        - commandId
        - createdAt
        - updatedAt
        - failureReason
        - recoveryPreviousState
        - recoveryStartedAt
      properties:
        missionId: { type: string }
        type: { const: TRANSPORT }
        externalReference: { type: string }
        priority: { type: number }
        requiredCapabilities:
          type: array
          items: { type: string }
        payloadKg: { type: number }
        pickup: { $ref: "#/components/schemas/Location" }
        dropoff: { $ref: "#/components/schemas/Location" }
        state:
          type: string
          enum: [CREATED, QUEUED, ASSIGNED, DISPATCHED, EXECUTING, RECOVERY_REQUIRED, CANCELLING, CANCELLED, COMPLETED, FAILED]
        assignedRobotId: { type: [string, "null"] }
        commandId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        failureReason: { type: [string, "null"] }
        recoveryPreviousState: { type: [string, "null"], enum: [ASSIGNED, DISPATCHED, EXECUTING, null] }
        recoveryStartedAt: { type: [string, "null"], format: date-time }
    MissionEvent:
      type: object
      required: [eventId, missionId, type, state, robotId, commandId, message, data, occurredAt]
      properties:
        eventId: { type: string }
        missionId: { type: string }
        type:
          type: string
          enum: [MISSION_QUEUED, ASSIGNMENT_NOT_FOUND, MISSION_ASSIGNED, ROUTE_RESERVED, ROUTE_DELAYED, ROUTE_RELEASED, ROBOT_CONNECTION_DEGRADED, ROBOT_OFFLINE, MISSION_RECOVERY_REQUIRED, MISSION_RECOVERED, MISSION_RECOVERY_REQUEUED, TRAFFIC_SAFETY_HOLD, COMMAND_DELIVERY_FAILED, COMMAND_DISPATCHED, COMMAND_REJECTED, MISSION_CANCELLATION_REQUESTED, MISSION_CANCELLATION_DELIVERY_FAILED, MISSION_CANCELLATION_REJECTED, MISSION_EXECUTING, MISSION_COMPLETED, MISSION_FAILED, MISSION_CANCELLED]
        state:
          type: string
          enum: [CREATED, QUEUED, ASSIGNED, DISPATCHED, EXECUTING, RECOVERY_REQUIRED, CANCELLING, CANCELLED, COMPLETED, FAILED]
        robotId: { type: [string, "null"] }
        commandId: { type: [string, "null"] }
        message: { type: string }
        data: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    CandidateEvaluation:
      type: object
      required: [robotId, eligible, score, reasons]
      properties:
        robotId: { type: string }
        eligible: { type: boolean }
        score: { type: [number, "null"] }
        reasons:
          type: array
          items: { type: string }
    AssignmentDecision:
      type: object
      required: [missionId, selectedRobotId, selectedScore, reasons, candidates]
      properties:
        missionId: { type: string }
        selectedRobotId: { type: [string, "null"] }
        selectedScore: { type: [number, "null"] }
        reasons:
          type: array
          items: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CandidateEvaluation" }
    CommandReceipt:
      type: object
      required: [schemaVersion, commandId, missionId, robotId, status, receivedAt]
      properties:
        schemaVersion: { const: "1.0" }
        commandId: { type: string }
        missionId: { type: string }
        robotId: { type: string }
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        receivedAt: { type: string, format: date-time }
        reason: { type: string }
    DispatchResult:
      type: object
      required: [mission, decision, receipt, route]
      properties:
        mission: { $ref: "#/components/schemas/Mission" }
        decision: { $ref: "#/components/schemas/AssignmentDecision" }
        receipt:
          oneOf:
            - { $ref: "#/components/schemas/CommandReceipt" }
            - { type: "null" }
        route:
          oneOf:
            - { $ref: "#/components/schemas/TrafficPlan" }
            - { type: "null" }
    MissionCancellationResult:
      type: object
      required: [mission, receipt]
      properties:
        mission: { $ref: "#/components/schemas/Mission" }
        receipt:
          oneOf:
            - { $ref: "#/components/schemas/CommandReceipt" }
            - { type: "null" }
    MapNode:
      type: object
      additionalProperties: false
      required: [nodeId, label, kind, x, y]
      properties:
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [WAYPOINT, INTERSECTION, STATION, HOLDING_POINT] }
        x: { type: number }
        y: { type: number }
        stationId: { type: string }
        zoneId: { type: string }
    MapEdge:
      type: object
      additionalProperties: false
      required: [edgeId, fromNodeId, toNodeId, directed, lengthMeters, travelTimeSeconds]
      properties:
        edgeId: { type: string }
        fromNodeId: { type: string }
        toNodeId: { type: string }
        directed: { type: boolean }
        lengthMeters: { type: number, minimum: 0 }
        travelTimeSeconds: { type: number, exclusiveMinimum: 0 }
    MapTopology:
      type: object
      additionalProperties: false
      required: [mapId, displayName, revision, nodes, edges]
      properties:
        mapId: { type: string }
        displayName: { type: string }
        revision: { type: integer, minimum: 1 }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/MapNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/MapEdge" }
    CreateMapVersionRequest:
      type: object
      additionalProperties: false
      required: [familyId, displayName, revision, nodes, edges, operatorId]
      properties:
        familyId: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        displayName: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        nodes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MapNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/MapEdge" }
        operatorId: { type: string, minLength: 1 }
    MapVersion:
      type: object
      additionalProperties: false
      required: [mapId, familyId, displayName, revision, status, createdBy, createdAt, publishedBy, publishedAt, retiredBy, retiredAt, nodeCount, edgeCount]
      properties:
        mapId: { type: string }
        familyId: { type: string }
        displayName: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        publishedBy: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        retiredBy: { type: [string, "null"] }
        retiredAt: { type: [string, "null"], format: date-time }
        nodeCount: { type: integer, minimum: 1 }
        edgeCount: { type: integer, minimum: 0 }
    CreateInfrastructureResourceRequest:
      type: object
      additionalProperties: false
      required: [resourceId, mapId, displayName, type, reservationPolicy, operatorId]
      properties:
        resourceId: { type: string, minLength: 1 }
        mapId: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        type: { type: string, enum: [DOOR, ELEVATOR, CHARGER, DOCK, WORKCELL] }
        reservationPolicy: { type: string, enum: [TRANSIT_EXCLUSIVE, SERVICE_EXCLUSIVE] }
        edgeId: { type: string, minLength: 1 }
        nodeId: { type: string, minLength: 1 }
        operatorId: { type: string, minLength: 1 }
      oneOf:
        - required: [edgeId]
          not: { required: [nodeId] }
        - required: [nodeId]
          not: { required: [edgeId] }
    UpdateInfrastructureResourceStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason, operatorId]
      properties:
        status: { type: string, enum: [AVAILABLE, UNAVAILABLE, MAINTENANCE] }
        reason: { type: string, minLength: 1 }
        operatorId: { type: string, minLength: 1 }
    InfrastructureResource:
      type: object
      additionalProperties: false
      required: [resourceId, mapId, displayName, type, status, reservationPolicy, edgeId, nodeId, createdBy, createdAt, updatedBy, updatedAt, statusReason]
      properties:
        resourceId: { type: string }
        mapId: { type: string }
        displayName: { type: string }
        type: { type: string, enum: [DOOR, ELEVATOR, CHARGER, DOCK, WORKCELL] }
        status: { type: string, enum: [AVAILABLE, UNAVAILABLE, MAINTENANCE] }
        reservationPolicy: { type: string, enum: [TRANSIT_EXCLUSIVE, SERVICE_EXCLUSIVE] }
        edgeId: { type: [string, "null"] }
        nodeId: { type: [string, "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        statusReason: { type: [string, "null"] }
    TrafficRouteSegment:
      type: object
      additionalProperties: false
      required: [sequence, phase, edgeId, fromNodeId, toNodeId, lengthMeters, enterAt, exitAt]
      properties:
        sequence: { type: integer, minimum: 0 }
        phase: { type: string, enum: [TO_PICKUP, TO_DROPOFF] }
        edgeId: { type: string }
        fromNodeId: { type: string }
        toNodeId: { type: string }
        lengthMeters: { type: number, minimum: 0 }
        enterAt: { type: string, format: date-time }
        exitAt: { type: string, format: date-time }
    TrafficPlan:
      type: object
      additionalProperties: false
      required: [routeId, missionId, robotId, mapId, status, originNodeId, pickupNodeId, dropoffNodeId, requestedStartAt, scheduledStartAt, expectedArrivalAt, totalDistanceMeters, totalWaitSeconds, segments, plannedAt, lastRenewedAt, leaseExpiresAt, releasedAt]
      properties:
        routeId: { type: string }
        missionId: { type: string }
        robotId: { type: string }
        mapId: { type: string }
        status: { type: string, enum: [ACTIVE, SAFETY_HOLD, RELEASED] }
        originNodeId: { type: string }
        pickupNodeId: { type: string }
        dropoffNodeId: { type: string }
        requestedStartAt: { type: string, format: date-time }
        scheduledStartAt: { type: string, format: date-time }
        expectedArrivalAt: { type: string, format: date-time }
        totalDistanceMeters: { type: number, minimum: 0 }
        totalWaitSeconds: { type: number, minimum: 0 }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TrafficRouteSegment" }
        plannedAt: { type: string, format: date-time }
        lastRenewedAt: { type: string, format: date-time }
        leaseExpiresAt: { type: string, format: date-time }
        releasedAt: { type: [string, "null"], format: date-time }
    TrafficReservation:
      type: object
      additionalProperties: false
      required: [reservationId, routeId, missionId, robotId, mapId, resourceId, resourceType, sequence, startsAt, endsAt, state, releasedAt]
      properties:
        reservationId: { type: string }
        routeId: { type: string }
        missionId: { type: string }
        robotId: { type: string }
        mapId: { type: string }
        resourceId: { type: string }
        resourceType: { type: string, enum: [EDGE, NODE, INFRASTRUCTURE] }
        sequence: { type: integer, minimum: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { type: string, enum: [ACTIVE, SAFETY_HOLD, RELEASED] }
        releasedAt: { type: [string, "null"], format: date-time }
    TrafficSchedule:
      type: object
      additionalProperties: false
      required: [mapId, updatedAt, plans, reservations]
      properties:
        mapId: { type: string }
        updatedAt: { type: string, format: date-time }
        plans:
          type: array
          items: { $ref: "#/components/schemas/TrafficPlan" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/TrafficReservation" }
    CreateTrafficRestrictionRequest:
      type: object
      additionalProperties: false
      required: [mapId, resourceId, reason, operatorId]
      properties:
        mapId: { type: string, minLength: 1 }
        resourceId:
          type: string
          pattern: "^(edge|node):.+$"
          description: Canonical traffic resource identifier such as edge:E-NORTH-02.
        reason: { type: string, minLength: 1 }
        operatorId: { type: string, minLength: 1 }
    TrafficRestriction:
      type: object
      additionalProperties: false
      required: [restrictionId, mapId, resourceId, status, reason, createdBy, createdAt, clearedBy, clearedAt]
      properties:
        restrictionId: { type: string }
        mapId: { type: string }
        resourceId: { type: string, pattern: "^(edge|node):.+$" }
        status: { type: string, enum: [ACTIVE, CLEARED] }
        reason: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        clearedBy: { type: [string, "null"] }
        clearedAt: { type: [string, "null"], format: date-time }
    FleetRecoveryStatus:
      type: object
      additionalProperties: false
      required: [evaluatedAt, degradedRobots, offlineRobots, recoveryRequiredMissions, safetyHolds, nextLeaseExpiryAt]
      properties:
        evaluatedAt: { type: string, format: date-time }
        degradedRobots: { type: integer, minimum: 0 }
        offlineRobots: { type: integer, minimum: 0 }
        recoveryRequiredMissions: { type: integer, minimum: 0 }
        safetyHolds: { type: integer, minimum: 0 }
        nextLeaseExpiryAt: { type: [string, "null"], format: date-time }
    RobotState:
      type: object
      required: [schemaVersion, robotId, sequence, observedAt, lastSeenAt, connectionChangedAt, connection, availability, batteryPercent, pose, activeMissionId]
      properties:
        schemaVersion: { const: "1.0" }
        robotId: { type: string }
        sequence: { type: integer, minimum: 0 }
        observedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        connectionChangedAt: { type: string, format: date-time }
        connection: { type: string, enum: [ONLINE, DEGRADED, OFFLINE] }
        availability: { type: string, enum: [AVAILABLE, RESERVED, EXECUTING, CHARGING, ERROR, MANUAL] }
        batteryPercent: { type: number, minimum: 0, maximum: 100 }
        pose:
          type: object
          required: [mapId, x, y, yaw]
          properties:
            mapId: { type: string }
            x: { type: number }
            y: { type: number }
            yaw: { type: number }
        activeMissionId: { type: [string, "null"] }
    Robot:
      type: object
      required: [robotId, displayName, vendor, model, capabilities, state]
      properties:
        robotId: { type: string }
        displayName: { type: string }
        vendor: { type: string }
        model: { type: string }
        capabilities:
          type: object
          required: [actions, maxPayloadKg, allowedZones]
          properties:
            actions:
              type: array
              items: { type: string }
            maxPayloadKg: { type: number, minimum: 0 }
            allowedZones:
              type: array
              items: { type: string }
        state: { $ref: "#/components/schemas/RobotState" }
    FleetSnapshot:
      type: object
      required: [schemaVersion, updatedAt, robots, missions]
      properties:
        schemaVersion: { const: "1.0" }
        updatedAt: { type: string, format: date-time }
        robots:
          type: array
          items: { $ref: "#/components/schemas/Robot" }
        missions:
          type: array
          items: { $ref: "#/components/schemas/Mission" }
    MissionQueueEntry:
      type: object
      additionalProperties: false
      required: [missionId, basePriority, effectivePriority, attemptCount, enqueuedAt, nextAttemptAt, lastAttemptAt, lastError, leaseOwner, leaseExpiresAt]
      properties:
        missionId: { type: string }
        basePriority: { type: integer, minimum: 0, maximum: 100 }
        effectivePriority: { type: integer, minimum: 0, maximum: 100 }
        attemptCount: { type: integer, minimum: 0 }
        enqueuedAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        leaseOwner: { type: [string, "null"] }
        leaseExpiresAt: { type: [string, "null"], format: date-time }
    DispatchQueue:
      type: object
      additionalProperties: false
      required: [evaluatedAt, pendingMissions, dueMissions, leasedMissions, nextAttemptAt, entries]
      properties:
        evaluatedAt: { type: string, format: date-time }
        pendingMissions: { type: integer, minimum: 0 }
        dueMissions: { type: integer, minimum: 0 }
        leasedMissions: { type: integer, minimum: 0 }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MissionQueueEntry" }
    Alarm:
      type: object
      additionalProperties: false
      required: [alarmId, fingerprint, code, severity, status, title, message, sourceType, sourceId, occurrenceCount, firstOccurredAt, lastOccurredAt, acknowledgedAt, acknowledgedBy, acknowledgementNote, resolvedAt]
      properties:
        alarmId: { type: string }
        fingerprint: { type: string }
        code: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        title: { type: string }
        message: { type: string }
        sourceType: { type: string, enum: [ROBOT, MISSION, TRAFFIC, SYSTEM] }
        sourceId: { type: string }
        occurrenceCount: { type: integer, minimum: 1 }
        firstOccurredAt: { type: string, format: date-time }
        lastOccurredAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        acknowledgedBy: { type: [string, "null"] }
        acknowledgementNote: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }
    AlarmSummary:
      type: object
      additionalProperties: false
      required: [evaluatedAt, open, acknowledged, critical, warning, alarms]
      properties:
        evaluatedAt: { type: string, format: date-time }
        open: { type: integer, minimum: 0 }
        acknowledged: { type: integer, minimum: 0 }
        critical: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        alarms:
          type: array
          items: { $ref: "#/components/schemas/Alarm" }
    AlarmActionRequest:
      type: object
      additionalProperties: false
      required: [operatorId]
      properties:
        operatorId: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            issues:
              type: array
              items: { type: string }
