# Development-only broker configuration for the Docker Compose VDA profile.
# Customer deployments must replace anonymous access with per-device identity,
# TLS, topic ACLs, persistent storage, monitoring, and certificate rotation.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
sys_interval 5
