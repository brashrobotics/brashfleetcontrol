global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - fleet-alerts.yml

scrape_configs:
  - job_name: brash-fleet-core
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fleet_metrics_token
    static_configs:
      - targets: ["fleet-server:4273"]
