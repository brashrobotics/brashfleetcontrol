services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brash_fleet
      POSTGRES_USER: brash
      POSTGRES_PASSWORD: brash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brash -d brash_fleet"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - brash-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  brash-postgres-data:
